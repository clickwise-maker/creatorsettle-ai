<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CreatorSettle AI — Seller Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #f4f1ea; margin: 0; padding: 20px; }
  h1 { font-size: 1.4rem; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin: 12px 0; }
  .action { font-weight: bold; }
  .RETRY { color: #6ee7b7; }
  .ESCALATE { color: #f87171; }
  .HOLD { color: #94a3b8; }
  button { background: #d4af37; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 8px; }
  button.reject { background: #555; color: #fff; }
  small { color: #888; }
  .status { font-weight: bold; }
  .PENDING { color: #fbbf24; }
  .APPROVED { color: #6ee7b7; }
  .REJECTED { color: #f87171; }
  .EXECUTED { color: #6ee7b7; }
</style>
</head>
<body>
<h1>CreatorSettle AI — Seller Dashboard</h1>
<p>Local only. Approvals persisted in approvals.json.</p>

<div id="status" class="card">Loading...</div>
<div id="txns"></div>

<script>
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function load() {
  const res = await fetch("/api/transactions");
  const txns = await res.json();
  document.getElementById("status").textContent = "Transactions loaded: " + txns.length;
  const container = document.getElementById("txns");
  container.innerHTML = "";
  txns.forEach(t => {
    const card = el("div", null, "card");
    card.appendChild(el("strong", t.id));
    card.appendChild(document.createTextNode(" — " + t.currency + " " + t.amount + " "));
    card.appendChild(el("small", "(" + t.source + ")"));
    card.appendChild(document.createElement("br"));
    card.appendChild(document.createTextNode("Status: " + (t.status || "")));
    card.appendChild(document.createElement("br"));
    const act = el("span", t.proposed_action, "action " + t.proposed_action);
    card.appendChild(document.createTextNode("Proposed: "));
    card.appendChild(act);
    card.appendChild(document.createElement("br"));
    card.appendChild(el("small", t.message || ""));
    card.appendChild(document.createElement("br"));
    const st = el("span", t.approval_status, "status " + t.approval_status);
    card.appendChild(document.createTextNode("Approval: "));
    card.appendChild(st);
    card.appendChild(document.createElement("br"));

    const approveBtn = el("button", "Approve");
    approveBtn.onclick = () => doApprove(t.id, t.proposed_action);
    const rejectBtn = el("button", "Reject", "reject");
    rejectBtn.onclick = () => doReject(t.id);
    card.appendChild(approveBtn);
    card.appendChild(rejectBtn);
    container.appendChild(card);
  });
}

async function doApprove(id, action) {
  await fetch("/api/propose/" + id, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: action, message: "From dashboard"})
  });
  const res = await fetch("/api/approve/" + id, {method: "POST"});
  const data = await res.json();
  if (data.status === "APPROVED") {
    const exec = await fetch("/api/execute/" + id, {method: "POST"});
    const result = await exec.json();
    alert("Execution: " + result.reason);
  } else {
    alert("Approval status: " + data.status);
  }
  load();
}

async function doReject(id) {
  // Only reject. Never execute on reject path.
  const res = await fetch("/api/reject/" + id, {method: "POST"});
  const data = await res.json();
  alert("Rejected: " + (data.status || data.error || "unknown"));
  load();
}

load();
</script>
</body>
</html>
