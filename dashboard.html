<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CreatorSettle AI — Seller Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #f4f1ea; margin: 0; padding: 20px; }
  h1 { font-size: 1.4rem; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin: 12px 0; }
  .action { font-weight: bold; }
  .RETRY { color: #6ee7b7; }
  .ESCALATE { color: #f87171; }
  .HOLD { color: #94a3b8; }
  button { background: #d4af37; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 8px; }
  button.reject { background: #555; color: #fff; }
  small { color: #888; }
  .status { font-weight: bold; }
  .PENDING { color: #fbbf24; }
  .APPROVED { color: #6ee7b7; }
  .REJECTED { color: #f87171; }
</style>
</head>
<body>
<h1>CreatorSettle AI — Seller Dashboard</h1>
<p>Connected to backend. Approvals are persisted in approvals.json.</p>

<div id="status" class="card">Loading...</div>
<div id="txns"></div>

<script>
async function load() {
  const res = await fetch("/api/transactions");
  const txns = await res.json();
  document.getElementById("status").innerHTML = `<strong>Transactions loaded:</strong> ${txns.length}`;
  const container = document.getElementById("txns");
  container.innerHTML = txns.map(t => `
    <div class="card" id="card-${t.id}">
      <strong>${t.id}</strong> — ${t.currency} ${t.amount} <small>(${t.source})</small><br>
      Status: ${t.status}<br>
      Proposed: <span class="action ${t.proposed_action}">${t.proposed_action}</span><br>
      <small>${t.message}</small><br>
      Approval: <span class="status ${t.approval_status}">${t.approval_status}</span><br>
      <button onclick="act('${t.id}', 'approve', '${t.proposed_action}', '${t.execution_type}')">Approve</button>
      <button class="reject" onclick="act('${t.id}', 'reject', '${t.proposed_action}', '${t.execution_type}')">Reject</button>
    </div>
  `).join("");
}

async function act(id, decision, action, execType) {
  // Propose first if not proposed
  await fetch(`/api/propose/${id}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action, message: "From dashboard"})
  });
  const endpoint = decision === "approve" ? `/api/approve/${id}` : `/api/reject/${id}`;
  const res = await fetch(endpoint, {method: "POST"});
  const data = await res.json();
  alert(`Approval: ${data.status}`);
  if (data.status === "APPROVED") {
    const exec = await fetch(`/api/execute/${id}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action, execution_type: execType})
    });
    const result = await exec.json();
    alert(`Execution: ${result.reason}`);
  }
  load();
}

load();
</script>
</body>
</html>
