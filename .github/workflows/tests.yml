name: CreatorSettle tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Recovery unit tests (mocked)
        run: python test_recovery.py
      - name: Subscription capture integration tests (mocked)
        run: python test_subscription_capture_flow.py
      - name: Existing application tests
        run: python test_creatorsettle.py
